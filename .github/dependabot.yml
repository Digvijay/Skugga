version: 2
updates:
  # Enable version updates for NuGet
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # The Skugga generators are Roslyn compiler extensions. The
      # Microsoft.CodeAnalysis *compiler* packages set the minimum Roslyn a
      # consumer must be running, so raising them drops support for older
      # SDKs rather than gaining anything. They are held at the floor the
      # generators are built against and moved only as a deliberate
      # supported-toolchain decision. Splitting them across Dependabot PRs
      # also skews generator and test projects apart (CS1705).
      # Microsoft.CodeAnalysis.Analyzers is dev-time only and stays current.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "Microsoft.CodeAnalysis.Common"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  # No dotnet-sdk entry: this repository deliberately has no global.json so
  # CI can build across the 8.0.x and 10.0.x SDK matrix. Dependabot aborts
  # the dotnet-sdk ecosystem outright when global.json is absent.
